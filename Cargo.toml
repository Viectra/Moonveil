[package]
name = "moonveil"
version = "0.1.0"
edition = "2021"
authors = ["Viectra"]
description = "Moonveil (mvl) — Clickable, animated terminal network scanner, subnet radar, and socket inspector for Linux"
license = "MIT"
readme = "README.md"

[[bin]]
name = "moonveil"
path = "src/main.rs"

[[bin]]
name = "mvl"
path = "src/bin/mvl.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
